# JDBC persistence, SQLite. See persistence/jdbc.persist for what is stored and
# why this exists next to rrd4j.
#
# The addon ships its own copy of this file with override="false", so this one
# wins and is not overwritten on install.
#
# /var/lib/openhab/persistence already exists (rrd4j and mapdb are in it) and is
# owned by openhab, so no directory has to be created; SQLite makes the file on
# first write. It is outside this repository and outside /etc/openhab, so
# deploy-openhab.sh neither writes nor deletes it.
#
# Nothing else is set on purpose. Table naming only matters when reading the file
# by hand, and the fit script reads through openHAB's REST API instead
# (/rest/persistence/items/<item>?serviceId=jdbc), which is indifferent to it.
url=jdbc:sqlite:/var/lib/openhab/persistence/smarthome.db
