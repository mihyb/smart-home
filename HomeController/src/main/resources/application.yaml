app:
  port: 8181
  openhab:
    # Default is loopback because openHAB runs on the same host as this app.
    # The old default pointed at 192.168.1.109, which no longer runs openHAB.
    baseUrl: "http://${OPENHAB_HOST:127.0.0.1}:${OPENHAB_PORT:8080}/rest/"
  electricity:
    oteUrl: "https://www.ote-cr.cz/cs/kratkodobe-trhy/elektrina/denni-trh?date="
  currency:
    usdRate: 23.82
    eurRate: 25.02
  timerJobs:
    - switchItem: "obyvak_switch"
      endHourItem: "timer_job_xmass_to"
      startHourItem: "timer_job_xmass_from"
      statusItem: "timer_job_xmass_status"
    - switchItem: "akvarium_svetlo_switch"
      endHourItem: "timer_job_aquarium_to"
      startHourItem: "timer_job_aquarium_from"
      statusItem: "timer_job_aquarium_status"
    - switchItem: "agama_switch"
      endHourItem: "timer_job_agama_to"
      startHourItem: "timer_job_agama_from"
      statusItem: "timer_job_agama_status"
    - switchItem: "Infrared_heating_panel_switch"
      endHourItem: "timer_job_wr_heating_to"
      startHourItem: "timer_job_wr_heating_from"
      statusItem: "timer_job_wr_heating_status"
      mode: weekday
    - switchItem: "obyvak_topeni_switch"
      endHourItem: "timer_job_lr_heating_to"
      startHourItem: "timer_job_lr_heating_from"
      statusItem: "timer_job_lr_heating_status"
    - switchItem: "pokoj_vysousec_switch"
      endHourItem: "timer_job_kr_moisture_to"
      startHourItem: "timer_job_kr_moisture_from"
      statusItem: "timer_job_kr_moisture_status"
      conditions:
        - item: "pokoj_okno_pokoj_okno_switch"
          value: "off"
    - switchItem: "vysousec_switch"
      endHourItem: "timer_job_wr_moisture_to"
      startHourItem: "timer_job_wr_moisture_from"
      statusItem: "timer_job_wr_moisture_status"
      conditions:
        - item: "pracovna_okno_OnOff_Switch"
          value: "off"
    - switchItem: "bojler_switch"
      endHourItem: "timer_job_wheater_to"
      startHourItem: "timer_job_wheater_from"
      statusItem: "timer_job_wheater_status"
    - switchItem: "loznice_vetrak_switch"
      endHourItem: "timer_job_bedroom_fan_to"
      startHourItem: "timer_job_bedroom_fan_from"
      statusItem: "timer_job_bedroom_fan_status"
  minMaxJobs:
    - switchItem: "chicks_01_Chick_01_switch"
      statusItem: "chick_01_power"
      valueItem: "chicks_01_Chick_01_temp"
      minValueItem: "chick_01_min_temp"
      maxValueItem: "chick_01_max_temp"
  boilerModeJobs:
    # While the solid-fuel boiler burns, take the heat on both circuits. Once it
    # is out, the hot water circuit would drain a tank with nothing refilling it,
    # so it stops and the heating goes back to its own schedule.
    #
    # "Burning" is either signal. Atmos_Exhaust_Fan ON is the direct one and
    # carries the whole burn; it is not enough on its own, because on an overheat
    # the boiler shuts the fan down while the water is at its hottest, and
    # reading that as "out" took both circuits off the boiler at the one moment
    # the heat most needed somewhere to go. So the boiler's own water above 85 C
    # counts as burning too -- that is more than the residual heat one that has
    # gone out coasts down through. It takes both signals to call it out.
    - statusItem: "boiler_auto_control"
      runningItem: "Atmos_Exhaust_Fan"
      temperatureItem: "Atmos_Boiler_Water"
      burningAboveCelsius: 85
      heatingModeItem: "Atmos_C1_Mode"
      waterModeItem: "Atmos_Water_Mode"
      # Which mode each case means is chosen from the sitemap, not here, so it
      # can be changed without a redeploy.
      runningHeatingModeItem: "boiler_auto_running_heating"
      runningWaterModeItem: "boiler_auto_running_water"
      idleHeatingModeItem: "boiler_auto_idle_heating"
      idleWaterModeItem: "boiler_auto_idle_water"
      # Where the job records what it last set, so it can tell a mode somebody
      # changed by hand from one it set itself.
      lastHeatingModeItem: "boiler_auto_last_heating"
      lastWaterModeItem: "boiler_auto_last_water"
  alarms:
    # Where a notification is handed over. Nothing in this app can push a
    # message -- sendNotification exists only inside openHAB -- so an alarm
    # commands this item and rules/notifications.rules turns it into a push.
    messageItem: "notify_message"
    # INFO is held between these hours and sent when they end. ALARM ignores them.
    quietFromHour: 22
    quietToHour: 7
  alarmJobs:
    # The energizers report volts, so the thresholds are volts even though the
    # sitemap shows kilovolts: 5000 = 5 kV, 11000 = 11 kV.
    #
    # Low means something is loading the fence down -- wet growth on the wire, a
    # cracked insulator, a broken line on the ground. High means the opposite:
    # nothing is drawing from it at all, so the wire is cut or a gate handle is
    # off. Both say the fence is not holding an animal, so both are ALARM and
    # neither waits for morning.
    #
    # Each one also hangs off the energizer's own state item, because a source
    # that is switched off reads 0 V and that is not a fault.
    - id: "fence-upper-low"
      severity: ALARM
      message: "Horní ohradník má jen {fence_upper_voltage}"
      clearMessage: "Horní ohradník je zpátky na {fence_upper_voltage}"
      conditions:
        - item: "fence_upper_state"
          value: "RUNNING"
        - item: "fence_upper_voltage"
          op: LT
          value: "5000"
      delayMinutes: 2
      repeat: 3
      intervalMinutes: 20
      clearMinutes: 10
    - id: "fence-upper-high"
      severity: ALARM
      message: "Horní ohradník {fence_upper_voltage}, nejspíš přerušený drát"
      clearMessage: "Horní ohradník zase v pořádku, {fence_upper_voltage}"
      conditions:
        - item: "fence_upper_state"
          value: "RUNNING"
        - item: "fence_upper_voltage"
          op: GT
          value: "11000"
      delayMinutes: 2
      repeat: 3
      intervalMinutes: 20
      clearMinutes: 10
    - id: "fence-lower-low"
      severity: ALARM
      message: "Spodní ohradník má jen {fence_lower_voltage}"
      clearMessage: "Spodní ohradník je zpátky na {fence_lower_voltage}"
      conditions:
        - item: "fence_lower_state"
          value: "RUNNING"
        - item: "fence_lower_voltage"
          op: LT
          value: "5000"
      delayMinutes: 2
      repeat: 3
      intervalMinutes: 20
      clearMinutes: 10
    - id: "fence-lower-high"
      severity: ALARM
      message: "Spodní ohradník {fence_lower_voltage}, nejspíš přerušený drát"
      clearMessage: "Spodní ohradník zase v pořádku, {fence_lower_voltage}"
      conditions:
        - item: "fence_lower_state"
          value: "RUNNING"
        - item: "fence_lower_voltage"
          op: GT
          value: "11000"
      delayMinutes: 2
      repeat: 3
      intervalMinutes: 20
      clearMinutes: 10
    # Without this one the two alarms above go quiet exactly when they matter:
    # the fence is only visible through fencee Cloud, and when that is down the
    # binding sets every channel to UNDEF, which no threshold can see. Half an
    # hour of silence is a cloud hiccup; longer than that and the fence could be
    # dead without anyone knowing.
    - id: "fence-unreachable"
      severity: INFO
      message: "Ohradník se neozývá, fencee Cloud je nedostupný"
      clearMessage: "Ohradník zase hlásí, horní {fence_upper_voltage}"
      conditions:
        - item: "fence_upper_voltage"
          op: UNDEF
      delayMinutes: 30
      repeat: 1
      clearMinutes: 5
server:
  port: "${app.port}"
logging:
  level:
    root: WARN
    com.hyblerm.homecontroller: DEBUG
  file:
    name: home-portal.log
spring:
  boot:
    admin:
      client:
        url: "http://127.0.0.1:${app.port}"
  datasource:
    url: "jdbc:h2:file:${H2_DATA_PATH:/tmp/data/demo}"
    driverClassName: "org.h2.Driver"
  jpa:
    database-platform: "org.hibernate.dialect.H2Dialect"
    hibernate:
      ddl-auto: "create"
management:
  endpoints:
    web:
      exposure:
        include: "*"