app:
  port: 8181
  openhab:
    # Default is loopback because openHAB runs on the same host as this app.
    # The old default pointed at 192.168.1.109, which no longer runs openHAB.
    baseUrl: "http://${OPENHAB_HOST:127.0.0.1}:${OPENHAB_PORT:8080}/rest/"
  electricity:
    oteUrl: "https://www.ote-cr.cz/cs/kratkodobe-trhy/elektrina/denni-trh?date="
  currency:
    usdRate: 23.82
    eurRate: 25.02
  timerJobs:
    - switchItem: "obyvak_switch"
      endHourItem: "timer_job_xmass_to"
      startHourItem: "timer_job_xmass_from"
      statusItem: "timer_job_xmass_status"
    - switchItem: "akvarium_svetlo_switch"
      endHourItem: "timer_job_aquarium_to"
      startHourItem: "timer_job_aquarium_from"
      statusItem: "timer_job_aquarium_status"
    - switchItem: "agama_switch"
      endHourItem: "timer_job_agama_to"
      startHourItem: "timer_job_agama_from"
      statusItem: "timer_job_agama_status"
    - switchItem: "Infrared_heating_panel_switch"
      endHourItem: "timer_job_wr_heating_to"
      startHourItem: "timer_job_wr_heating_from"
      statusItem: "timer_job_wr_heating_status"
      mode: weekday
    - switchItem: "obyvak_topeni_switch"
      endHourItem: "timer_job_lr_heating_to"
      startHourItem: "timer_job_lr_heating_from"
      statusItem: "timer_job_lr_heating_status"
    - switchItem: "pokoj_vysousec_switch"
      endHourItem: "timer_job_kr_moisture_to"
      startHourItem: "timer_job_kr_moisture_from"
      statusItem: "timer_job_kr_moisture_status"
      conditions:
        - item: "pokoj_okno_pokoj_okno_switch"
          value: "off"
    - switchItem: "vysousec_switch"
      endHourItem: "timer_job_wr_moisture_to"
      startHourItem: "timer_job_wr_moisture_from"
      statusItem: "timer_job_wr_moisture_status"
      conditions:
        - item: "pracovna_okno_OnOff_Switch"
          value: "off"
    - switchItem: "bojler_switch"
      endHourItem: "timer_job_wheater_to"
      startHourItem: "timer_job_wheater_from"
      statusItem: "timer_job_wheater_status"
    - switchItem: "loznice_vetrak_switch"
      endHourItem: "timer_job_bedroom_fan_to"
      startHourItem: "timer_job_bedroom_fan_from"
      statusItem: "timer_job_bedroom_fan_status"
  minMaxJobs:
    - switchItem: "chicks_01_Chick_01_switch"
      statusItem: "chick_01_power"
      valueItem: "chicks_01_Chick_01_temp"
      minValueItem: "chick_01_min_temp"
      maxValueItem: "chick_01_max_temp"
  boilerModeJobs:
    # While the solid-fuel boiler burns, take the heat on both circuits. Once it
    # is out, the hot water circuit would drain a tank with nothing refilling it,
    # so it stops and the heating goes back to its own schedule.
    #
    # "Burning" is either signal. Atmos_Exhaust_Fan ON is the direct one and
    # carries the whole burn; it is not enough on its own, because on an overheat
    # the boiler shuts the fan down while the water is at its hottest, and
    # reading that as "out" took both circuits off the boiler at the one moment
    # the heat most needed somewhere to go. So the boiler's own water above 85 C
    # counts as burning too -- that is more than the residual heat one that has
    # gone out coasts down through. It takes both signals to call it out.
    - statusItem: "boiler_auto_control"
      runningItem: "Atmos_Exhaust_Fan"
      temperatureItem: "Atmos_Boiler_Water"
      burningAboveCelsius: 85
      heatingModeItem: "Atmos_C1_Mode"
      waterModeItem: "Atmos_Water_Mode"
      # Which mode each case means is chosen from the sitemap, not here, so it
      # can be changed without a redeploy.
      runningHeatingModeItem: "boiler_auto_running_heating"
      runningWaterModeItem: "boiler_auto_running_water"
      idleHeatingModeItem: "boiler_auto_idle_heating"
      idleWaterModeItem: "boiler_auto_idle_water"
      # Where the job records what it last set, so it can tell a mode somebody
      # changed by hand from one it set itself.
      lastHeatingModeItem: "boiler_auto_last_heating"
      lastWaterModeItem: "boiler_auto_last_water"
  # Heating advisories. None of these switches anything: each writes what it thinks
  # into an item and the alarm table below turns that into a message. The panels are
  # switched by hand, and the point of running this first is to see whether the
  # advice would have been right before it is ever allowed to act.
  houseDemand:
    statusItem: "heating_advice_control"
    # Whether the boiler is already answering. Heat still in the tank is on its way
    # into the rooms, and a fire already lit has not charged it yet -- neither is a
    # house nobody has done anything about.
    chargeItem: "Atmos_Buffer_Charge"
    burningItem: "Atmos_Exhaust_Fan"
    tankCoversAbovePercent: 40
    # One cold room is local work for that room's own panel. Two at once are not:
    # electricity costs more than wood, and the boiler takes hours to bring the whole
    # system up, so it is worth asking for early rather than often.
    fireAboveColdRooms: 2
    toleranceKelvin: 0.3
    # The whole house is empty overnight, so it is said once here rather than copied into
    # every room. A house left to coast from nine until six is the setback working.
    nightFromHour: 21
    nightToHour: 6
    coldRoomsItem: "heating_cold_rooms"
    coldestRoomItem: "heating_coldest_room"
    coldestGapItem: "heating_coldest_gap"
    alertItem: "heating_house_alert"
    # Only the three rooms that are setpoints. The hallway, bathroom, entry hall and
    # cellar are monitored and nothing more, and they stay out of this by having no
    # band set rather than by being listed as exceptions.
    rooms:
      # The living room is in use all day, so the night is the only thing that takes it
      # out of the count.
      - name: "obyvak"
        temperatureItem: "obyvak_temp_temperature"
        minItem: "room_min_obyvak"
        maxItem: "room_max_obyvak"
        localHeaterItem: "obyvak_topeni_switch"
      # No localHeaterItem: the kids' room has a dehumidifier and no heating of its
      # own, so it being cold is something only the boiler can answer -- which is why
      # one cold room here escalates without waiting for a second.
      - name: "pokojicek"
        temperatureItem: "pokojicek_temp_temperature"
        minItem: "room_min_pokojicek"
        maxItem: "room_max_pokojicek"
        windowItem: "pokoj_okno_pokoj_okno_switch"
        # At school on weekdays. At the weekend only the night applies.
        offWindows:
          - fromHour: 7
            toHour: 14
            mode: weekday
      - name: "pracovna"
        temperatureItem: "pracovna_teplota_temp"
        minItem: "room_min_pracovna"
        maxItem: "room_max_pracovna"
        localHeaterItem: "Infrared_heating_panel_switch"
        windowItem: "pracovna_okno_OnOff_Switch"
        # Empty from mid-afternoon, so it is in use roughly six until three.
        offWindows:
          - fromHour: 15
            toHour: 22
  panelAdviceJobs:
    # The two rooms that have a panel. switchItem is read and never commanded.
    - statusItem: "heating_advice_control"
      # roomName ties this panel to the room above, so the band and the hours it is in
      # use are stated once and cannot drift apart.
      roomName: "pracovna"
      # Switching a panel on shortly before the room empties buys nothing. There is no
      # equivalent rule on the boiler: a late fire still charges the tank for tomorrow.
      minimumRunMinutes: 45
      switchItem: "Infrared_heating_panel_switch"
      temperatureItem: "pracovna_teplota_temp"
      minItem: "room_min_pracovna"
      maxItem: "room_max_pracovna"
      windowItem: "pracovna_okno_OnOff_Switch"
      circuitPumpItem: "Atmos_C1_Pump"
      chargeItem: "Atmos_Buffer_Charge"
      tankCoversAbovePercent: 40
      adviceItem: "panel_advice_pracovna"
      alertItem: "panel_advice_pracovna_alert"
    - statusItem: "heating_advice_control"
      roomName: "obyvak"
      minimumRunMinutes: 45
      switchItem: "obyvak_topeni_switch"
      temperatureItem: "obyvak_temp_temperature"
      minItem: "room_min_obyvak"
      maxItem: "room_max_obyvak"
      circuitPumpItem: "Atmos_C1_Pump"
      chargeItem: "Atmos_Buffer_Charge"
      tankCoversAbovePercent: 40
      adviceItem: "panel_advice_obyvak"
      alertItem: "panel_advice_obyvak_alert"
  boilerAdviceJobs:
    # Will the tank cover tomorrow? A day's warning is what makes wood available in
    # time; without it the house falls back on the panels, which cost more.
    #
    # chargePercentPerDegreeDay and chargePercentPerMegajoule are calibration, not
    # daily choices, which is why they are here rather than in item state. Start by
    # watching what it says against what the tank actually did, and correct the first
    # one; the sun credit stays at zero until there is a reason to believe a number,
    # because a credit that is guessed asks for too little wood.
    - statusItem: "heating_advice_control"
      chargeItem: "Atmos_Buffer_Charge"
      minTomorrowItem: "weather_temp_min_tomorrow"
      maxTomorrowItem: "weather_temp_max_tomorrow"
      solarTomorrowItem: "weather_solar_sum_tomorrow"
      forecastUpdatedItem: "weather_updated"
      adviceItem: "boiler_advice"
      neededItem: "boiler_advice_needed"
      shortfallItem: "boiler_advice_shortfall"
      alertItem: "boiler_advice_alert"
      baseTemperatureCelsius: 18
      # Measured by scripts/fit-buffer-drain.py over eight days that began with a full
      # tank: 33 % of it a day plus 0.7 % per degree-day, which is 2.6 days per full
      # tank in the weather it was fitted in -- the two to three days this house
      # actually gets. Almost all of the demand is the baseline, because the circuit
      # runs the regulator's weekly programme rather than following the thermometer.
      #
      # Fitted over daily means of 8.5 to 14.2 C and nothing colder, so the slope is
      # the weak part. Re-run the script after the first real cold spell: under-
      # predicting asks for too little wood, which is the expensive direction.
      baselinePercentPerDay: 33
      chargePercentPerDegreeDay: 0.7
      chargePercentPerMegajoule: 0
      staleForecastHours: 3
      adviseFromHour: 16
      adviseToHour: 22
  alarms:
    # Where a notification is handed over. Nothing in this app can push a
    # message -- sendNotification exists only inside openHAB -- so an alarm
    # commands this item and rules/notifications.rules turns it into a push.
    messageItem: "notify_message"
    # INFO is held between these hours and sent when they end. ALARM ignores them.
    quietFromHour: 22
    quietToHour: 7
  alarmJobs:
    # Heating advice. All INFO: quiet hours hold them until morning, which is right --
    # nobody lights a boiler at three in the morning, and the condition is still true
    # when they end, so the message is held rather than lost.
    - id: "house-cold"
      severity: INFO
      message: "V domě je zima: {heating_cold_rooms} pokoje pod pásmem, nejvíc {heating_coldest_room} o {heating_coldest_gap} °C. Nádrž má {Atmos_Buffer_Charge} %, zatop."
      clearMessage: "Dům je zpátky v pásmu."
      conditions:
        - item: "heating_house_alert"
          value: "ON"
      # Half an hour before saying anything and two hours between: a fire is a
      # decision that takes an hour to act on and hours to undo, so this is the one
      # alarm that must not be eager.
      delayMinutes: 30
      repeat: 2
      intervalMinutes: 120
      clearMinutes: 60
    - id: "boiler-tomorrow"
      severity: INFO
      message: "Na zítřek bude potřeba {boiler_advice_needed} % nádrže, teď je {Atmos_Buffer_Charge} %. Zatop."
      clearMessage: "Nádrž na zítřek stačí, {Atmos_Buffer_Charge} %."
      conditions:
        - item: "boiler_advice_alert"
          value: "ON"
      delayMinutes: 15
      repeat: 1
      intervalMinutes: 120
      clearMinutes: 60
    # One per room with a panel. The message says both states rather than an
    # instruction, because the switch stays a person's decision for now.
    - id: "panel-pracovna"
      severity: INFO
      message: "Pracovna {pracovna_teplota_temp}: topení je {Infrared_heating_panel_switch}, mělo by být {panel_advice_pracovna}."
      clearMessage: ""
      conditions:
        - item: "panel_advice_pracovna_alert"
          value: "ON"
      delayMinutes: 20
      repeat: 1
      intervalMinutes: 60
      clearMinutes: 30
    - id: "panel-obyvak"
      severity: INFO
      message: "Obyvák {obyvak_temp_temperature}: topení je {obyvak_topeni_switch}, mělo by být {panel_advice_obyvak}."
      clearMessage: ""
      conditions:
        - item: "panel_advice_obyvak_alert"
          value: "ON"
      delayMinutes: 20
      repeat: 1
      intervalMinutes: 60
      clearMinutes: 30
    # Without this the advice above goes quiet exactly when it stops working. Every
    # one of them needs the forecast, and a forecast that stopped arriving leaves the
    # last numbers standing in the items -- so the advisory reads UNKNOWN and says
    # nothing, which looks the same as a house that is fine.
    - id: "advice-blind"
      severity: INFO
      message: "Doporučení k topení neběží, předpověď nepřichází od {weather_updated}."
      clearMessage: "Předpověď je zpátky, doporučení běží."
      conditions:
        - item: "boiler_advice"
          value: "UNKNOWN"
      delayMinutes: 180
      repeat: 1
      clearMinutes: 30
    # The energizers report volts, so the thresholds are volts even though the
    # sitemap shows kilovolts: 5000 = 5 kV, 11000 = 11 kV.
    #
    # Low means something is loading the fence down -- wet growth on the wire, a
    # cracked insulator, a broken line on the ground. High means the opposite:
    # nothing is drawing from it at all, so the wire is cut or a gate handle is
    # off. Both say the fence is not holding an animal, so both are ALARM and
    # neither waits for morning.
    #
    # Each one also hangs off the energizer's own state item, because a source
    # that is switched off reads 0 V and that is not a fault.
    - id: "fence-upper-low"
      severity: ALARM
      message: "Horní ohradník má jen {fence_upper_voltage}"
      clearMessage: "Horní ohradník je zpátky na {fence_upper_voltage}"
      conditions:
        - item: "fence_upper_state"
          value: "RUNNING"
        - item: "fence_upper_voltage"
          op: LT
          value: "5000"
      delayMinutes: 2
      repeat: 3
      intervalMinutes: 20
      clearMinutes: 10
    - id: "fence-upper-high"
      severity: ALARM
      message: "Horní ohradník {fence_upper_voltage}, nejspíš přerušený drát"
      clearMessage: "Horní ohradník zase v pořádku, {fence_upper_voltage}"
      conditions:
        - item: "fence_upper_state"
          value: "RUNNING"
        - item: "fence_upper_voltage"
          op: GT
          value: "11000"
      delayMinutes: 2
      repeat: 3
      intervalMinutes: 20
      clearMinutes: 10
    - id: "fence-lower-low"
      severity: ALARM
      message: "Spodní ohradník má jen {fence_lower_voltage}"
      clearMessage: "Spodní ohradník je zpátky na {fence_lower_voltage}"
      conditions:
        - item: "fence_lower_state"
          value: "RUNNING"
        - item: "fence_lower_voltage"
          op: LT
          value: "5000"
      delayMinutes: 2
      repeat: 3
      intervalMinutes: 20
      clearMinutes: 10
    - id: "fence-lower-high"
      severity: ALARM
      message: "Spodní ohradník {fence_lower_voltage}, nejspíš přerušený drát"
      clearMessage: "Spodní ohradník zase v pořádku, {fence_lower_voltage}"
      conditions:
        - item: "fence_lower_state"
          value: "RUNNING"
        - item: "fence_lower_voltage"
          op: GT
          value: "11000"
      delayMinutes: 2
      repeat: 3
      intervalMinutes: 20
      clearMinutes: 10
    # Without this one the two alarms above go quiet exactly when they matter:
    # the fence is only visible through fencee Cloud, and when that is down the
    # binding sets every channel to UNDEF, which no threshold can see. Half an
    # hour of silence is a cloud hiccup; longer than that and the fence could be
    # dead without anyone knowing.
    - id: "fence-unreachable"
      severity: INFO
      message: "Ohradník se neozývá, fencee Cloud je nedostupný"
      clearMessage: "Ohradník zase hlásí, horní {fence_upper_voltage}"
      conditions:
        - item: "fence_upper_voltage"
          op: UNDEF
      delayMinutes: 30
      repeat: 1
      clearMinutes: 5
server:
  port: "${app.port}"
logging:
  level:
    root: WARN
    com.hyblerm.homecontroller: DEBUG
  file:
    name: home-portal.log
spring:
  boot:
    admin:
      client:
        url: "http://127.0.0.1:${app.port}"
  datasource:
    url: "jdbc:h2:file:${H2_DATA_PATH:/tmp/data/demo}"
    driverClassName: "org.h2.Driver"
  jpa:
    database-platform: "org.hibernate.dialect.H2Dialect"
    hibernate:
      ddl-auto: "create"
management:
  endpoints:
    web:
      exposure:
        include: "*"